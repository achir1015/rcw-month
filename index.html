<style>
  :root{
    --bg: #F4F7F6;
    --surface: #FFFFFF;
    --ink: #1E2A28;
    --ink-muted: #5C6D68;
    --line: #DCE4E1;
    --line-strong: #C3CFCB;

    --nurse: #1F6F63;
    --nurse-tint: #E4F1EE;
    --assistant: #A9721F;
    --assistant-tint: #F5EBDA;

    --shift-d: #B4780E;
    --shift-d-bg: #FBEBCD;
    --shift-e: #A24B30;
    --shift-e-bg: #F6E1D8;
    --shift-n: #34437A;
    --shift-n-bg: #E3E6F3;
    --shift-off: #7C8683;
    --shift-off-bg: #ECEFED;
    --shift-other: #4A4A46;
    --shift-other-bg: #EFEEE8;

    --radius: 8px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header.app-header{
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  header.app-header h1{
    font-family: "Noto Serif TC", serif;
    font-size:32.5px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: 0.02em;
  }
  header.app-header p{
    margin: 0;
    color: var(--ink-muted);
    font-size:17.5px;
  }

  main{
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px 20px 64px;
  }

  /* ---- 類別切換 ---- */
  .category-picker{
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
  }
  .category-btn{
    flex: 1;
    max-width: 260px;
    padding: 16px 18px;
    border-radius: var(--radius);
    border: 1.5px solid var(--line-strong);
    background: var(--surface);
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: border-color .15s ease, background .15s ease;
  }
  .category-btn .cat-name{
    display:block;
    font-size:21.2px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .category-btn .cat-hint{
    display:block;
    font-size:15.6px;
    color: var(--ink-muted);
  }
  .category-btn[data-cat="nurse"].active{
    border-color: var(--nurse);
    background: var(--nurse-tint);
  }
  .category-btn[data-cat="nurse"].active .cat-name{ color: var(--nurse); }
  .category-btn[data-cat="assistant"].active{
    border-color: var(--assistant);
    background: var(--assistant-tint);
  }
  .category-btn[data-cat="assistant"].active .cat-name{ color: var(--assistant); }

  .empty-hint{
    padding: 48px 24px;
    text-align: center;
    color: var(--ink-muted);
    border: 1.5px dashed var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }

  .workspace{ display:none; }
  .workspace.active{ display:block; }

  .panel{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .panel h2{
    font-size:18.8px;
    font-weight: 700;
    margin: 0 0 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }

  .field-row{
    display:flex;
    align-items:flex-end;
    gap: 14px;
    flex-wrap: wrap;
  }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:15.6px; color: var(--ink-muted); }
  .field input, .field select{
    font-family: inherit;
    font-size:17.5px;
    padding: 8px 10px;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    width: 110px;
  }

  button.btn{
    font-family: inherit;
    font-size:17.5px;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 6px;
    border: 1px solid transparent;
    cursor: pointer;
  }
  button.btn-primary{ background: var(--ink); color: #fff; }
  button.btn-primary:disabled{ background:#B8BEBB; cursor:not-allowed; }
  button.btn-ghost{ background: transparent; color: var(--ink-muted); border-color: var(--line-strong); }
  button.btn-danger{ background: transparent; color: #A24B30; border-color: #E3C4B7; }

  input[type="file"]{ font-family: inherit; font-size:16.9px; }

  .upload-note{ font-size:15.6px; color: var(--ink-muted); margin-top: 8px; line-height:1.6; }

  /* ---- 匯入預覽區 ---- */
  .import-preview{
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px dashed var(--line);
    display:none;
  }
  .import-preview.show{ display:block; }
  .import-warning{
    font-size:16.2px;
    color: #A24B30;
    background: var(--shift-e-bg);
    border: 1px solid #E3C4B7;
    padding: 8px 12px;
    border-radius: 6px;
    margin-bottom: 12px;
  }
  .import-actions{ display:flex; gap:10px; margin-top: 14px; }

  /* ---- 班表格 ---- */
  /* 手機用需要「上下左右都能滑、重要欄位/列都凍結」，
     所以限制捲動容器的高度，讓表頭(上)和員編/姓名欄(左)都能用 position:sticky 固定住 */
  .table-scroll{
    overflow: auto;
    max-height: 70vh;
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  table.schedule-table{
    border-collapse: collapse;
    font-size:15.6px;
    white-space: nowrap;
  }
  table.schedule-table th, table.schedule-table td{
    border: 1px solid var(--line);
    padding: 6px 8px;
    text-align: center;
  }
  table.schedule-table thead{
    position: sticky;
    top: 0;
    z-index: 3;
  }
  table.schedule-table thead th{
    background: #F0F3F2;
    font-weight: 600;
    color: var(--ink-muted);
  }
  table.schedule-table thead th.weekend{
    color: var(--shift-e);
    background: var(--shift-e-bg);
  }
  table.schedule-table .col-id, table.schedule-table .col-name{
    position: sticky;
    background: var(--surface);
    font-weight: 600;
  }
  table.schedule-table .col-id{ left: 0; min-width: 66px; }
  table.schedule-table .col-name{ left: 66px; min-width: 76px; text-align:left; }
  table.schedule-table tbody .col-id, table.schedule-table tbody .col-name{ z-index:1; }
  /* 表頭左上角那兩格，同時吃到「上」跟「左」兩種凍結，層級要最高才不會被別的格子蓋住 */
  table.schedule-table thead .col-id, table.schedule-table thead .col-name{ background:#F0F3F2; z-index:4; }

  /* ---- 統計列 ---- */
  /* 統計區塊放進 tfoot，並整塊固定在捲動容器的最下方，垂直捲動時隨時看得到 */
  table.schedule-table tfoot{
    position: sticky;
    bottom: 0;
    z-index: 3;
  }
  tr.stat-row td{ font-weight: 700; background: #F7F5EE; }
  tr.stat-row td.col-id, tr.stat-row td.col-name{ background: #F7F5EE; }
  tr.stat-row.stat-divider td{ border-top: 2px solid var(--line-strong); }
  tr.stat-row .stat-row-label{ color: var(--ink); }
  td.stat-count{ text-align: center; color: var(--ink); }
  /* 統計區塊左上角(左邊標籤欄位)，同時吃到「下」跟「左」兩種凍結，層級要最高 */
  table.schedule-table tfoot .col-id, table.schedule-table tfoot .col-name{ z-index: 4; }
  /* 合計列：粗體、黑色、字級比其他統計列再放大15% (15.6px * 1.15 ≈ 17.9px) */
  tr.stat-row.stat-total td{ font-weight: 700; color: #000; font-size: 17.9px; background: #F1EEE2; }
  tr.stat-row.stat-total td.col-id, tr.stat-row.stat-total td.col-name{ background: #F1EEE2; }

  table.personal-stat-table{
    border-collapse: collapse;
    width: 100%;
    margin-top: 14px;
  }
  table.personal-stat-table th, table.personal-stat-table td{
    border: 1px solid var(--line);
    padding: 8px 6px;
    text-align: center;
  }
  table.personal-stat-table thead th{ background:#F0F3F2; color: var(--ink-muted); font-weight:600; }
  table.personal-stat-table .stat-row-label{ font-weight:700; background:#F7F5EE; text-align:left; padding-left:12px; }
  table.personal-stat-table td.stat-count{ font-weight:700; font-size:18.8px; }

  td.shift-d{ color: var(--shift-d); background: var(--shift-d-bg); }
  td.shift-e{ color: var(--shift-e); background: var(--shift-e-bg); }
  td.shift-n{ color: var(--shift-n); background: var(--shift-n-bg); }
  td.shift-off{ color: var(--shift-off); background: var(--shift-off-bg); }
  td.shift-other{ color: var(--shift-other); background: var(--shift-other-bg); }
  td.shift-empty{ color: var(--line-strong); }

  .legend{ display:flex; gap:14px; flex-wrap:wrap; margin: 12px 2px 0; font-size:15px; color: var(--ink-muted); }
  .legend span.swatch{ display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }

  .clickable-name{ cursor:pointer; text-decoration: underline dotted; text-underline-offset: 2px; }
  .clickable-name:hover{ background: rgba(31,111,99,0.08); }

  /* 班別代碼可點擊編輯：滑鼠移上去提示可以點，編輯中則顯示一個小輸入框 */
  td.shift.editable-shift{ cursor:pointer; }
  td.shift.editable-shift:hover{ outline: 2px dashed var(--nurse); outline-offset: -2px; }
  td.shift.editing{ padding: 2px; }
  td.shift input.shift-edit-input{
    width: 100%;
    min-width: 44px;
    box-sizing: border-box;
    text-align: center;
    font: inherit;
    font-weight: 700;
    border: 2px solid var(--nurse);
    border-radius: 4px;
    padding: 4px 2px;
    background: #FFFFFF;
    color: var(--ink);
  }
  td.shift select.shift-edit-select{
    width: 100%;
    min-width: 56px;
    box-sizing: border-box;
    text-align: center;
    text-align-last: center;
    font: inherit;
    font-weight: 700;
    border: 2px solid var(--nurse);
    border-radius: 4px;
    padding: 4px 2px;
    background: #FFFFFF;
    color: var(--ink);
  }

  /* ---- 個人月班表(月曆樣式) ---- */
  /* 同樣限制高度，讓「星期」表頭在垂直捲動時固定在上方；欄位有最小寬度，
     手機螢幕太窄時會出現水平捲動，此時表頭仍會固定在上面 */
  .calendar-scroll{
    overflow: auto;
    max-height: 70vh;
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  table.calendar-table{
    border-collapse: collapse;
    width: 100%;
    min-width: 560px;
  }
  table.calendar-table th, table.calendar-table td{
    border: 1px solid var(--line);
    text-align: center;
    vertical-align: top;
    min-width: 76px;
  }
  table.calendar-table thead{
    position: sticky;
    top: 0;
    z-index: 2;
  }
  table.calendar-table thead th{
    background: #F0F3F2;
    font-weight: 600;
    color: var(--ink-muted);
    padding: 8px 4px;
    font-size:15.6px;
  }
  table.calendar-table thead th.weekend{ color: var(--shift-e); background: var(--shift-e-bg); }
  table.calendar-table td.cal-day{ height: 64px; padding: 6px 4px; }
  table.calendar-table td.cal-empty{ background: #FAFBFA; }
  .cal-day-num{ font-size:15px; color: var(--ink-muted); text-align: left; margin-bottom: 6px; }
  .cal-day-shift{ font-size:17.5px; font-weight: 700; }

  .toast-wrap{ position: fixed; bottom: 22px; right: 22px; display:flex; flex-direction:column; gap:8px; z-index: 50; }
  .toast{
    background: var(--ink); color:#fff; padding: 10px 16px; border-radius: 6px;
    font-size:16.9px; box-shadow: 0 4px 14px rgba(0,0,0,.18);
    animation: toast-in .18s ease;
  }
  .toast.error{ background: #A24B30; }
  @keyframes toast-in{ from{ opacity:0; transform: translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ---- 資料備份區 ---- */
  .backup-panel{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 20px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .backup-panel .backup-info{ font-size:15.6px; color: var(--ink-muted); line-height:1.6; }
  .backup-panel .backup-actions{ display:flex; gap:10px; align-items:center; }
  .backup-panel .btn-import-xml-label{
    font-family: inherit; font-size:17.5px; font-weight:600; padding:9px 18px;
    border-radius:6px; border:1px solid var(--line-strong); color: var(--ink-muted);
    cursor:pointer; background: transparent;
  }

  /* ---- 登入畫面 ---- */
  #loginScreen{
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px 28px;
    width: 100%;
    max-width: 360px;
  }
  .login-card h1{
    font-family: "Noto Serif TC", serif;
    font-size:25px;
    margin: 0 0 4px;
  }
  .login-card p.login-sub{ font-size:15.6px; color:var(--ink-muted); margin:0 0 20px; }
  .login-card .field{ margin-bottom: 14px; }
  .login-card .field label{ display:block; font-size:15.6px; color:var(--ink-muted); margin-bottom:5px; }
  .login-card .field input{
    width: 100%; font-family: inherit; font-size:17.5px; padding:9px 10px;
    border:1px solid var(--line-strong); border-radius:6px; background:#fff; color:var(--ink);
    box-sizing: border-box;
  }
  .login-card button.btn-login{
    width:100%; margin-top:6px;
    font-family: inherit; font-size:17.5px; font-weight:700; padding:10px 18px;
    border-radius:6px; border:none; background:var(--ink); color:#fff; cursor:pointer;
  }
  .login-card button.btn-login:disabled{ background:#B8BEBB; cursor:not-allowed; }
  .login-error{ font-size:15.6px; color:#A24B30; margin-top:10px; min-height:1em; }

  .header-user-bar{
    display:flex; align-items:center; justify-content:space-between;
    max-width:1180px; margin:0 auto; padding:0 32px;
  }
  .header-user-bar .user-email{ font-size:15.6px; color:var(--ink-muted); }
  .header-user-bar button.btn-logout{
    font-family: inherit; font-size:15.6px; color:var(--ink-muted);
    background:transparent; border:1px solid var(--line-strong); border-radius:6px;
    padding:5px 12px; cursor:pointer;
  }

  /* ---- 選擇單位（公司／部門）畫面 ---- */
  #orgScreen{
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  #orgScreen .login-card{ max-width: 440px; }
  .login-card .field select{
    width: 100%; font-family: inherit; font-size:17.5px; padding:9px 10px;
    border:1px solid var(--line-strong); border-radius:6px; background:#fff; color:var(--ink);
    box-sizing: border-box;
  }
  .org-picked{
    font-size:15.6px; color:var(--ink); background:var(--bg, #f5f5f3);
    border:1px solid var(--line); border-radius:6px; padding:8px 12px; margin:-4px 0 14px;
  }
  .link-btn{
    font-family: inherit; font-size:15.6px; color:var(--ink-muted);
    background:none; border:none; text-decoration:underline; cursor:pointer; padding:4px 0;
  }
  .org-manage{ margin-top:18px; padding-top:16px; border-top:1px dashed var(--line); }
  .org-manage h2{ font-size:18px; margin:0 0 10px; }
  .org-row{
    display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .org-row .org-co{ font-size:14.5px; color:var(--ink-muted); }
  .org-row .org-dep{ font-size:16.5px; font-weight:700; }
  .org-row-actions{ display:flex; gap:6px; }
  .org-row-actions button, .org-form-actions button{
    font-family: inherit; font-size:15px; padding:5px 12px; border-radius:6px; cursor:pointer;
    border:1px solid var(--line-strong); background:#fff; color:var(--ink);
  }
  .org-row-actions button.danger{ color:#A24B30; border-color:#D9A898; }
  .org-form{ margin-top:14px; }
  .org-form-actions{ display:flex; gap:8px; margin-top:4px; }
  .org-form-actions button.primary{ background:var(--ink); color:#fff; border-color:var(--ink); font-weight:700; }
  .org-hint{ font-size:14px; color:var(--ink-muted); margin:-8px 0 12px; }
  .header-org-company{ font-size:15.6px; color:var(--ink-muted); margin:0 0 2px; }
  .header-user-bar .header-actions{ display:flex; gap:8px; }

  /* =====================================================================
     App 功能：更新提示列、左下角工具鈕、語音說明面板、安裝引導
     ===================================================================== */
  .update-banner{
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    display: none; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--nurse); color: #fff; font-size: 16.5px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .update-banner.show{ display: flex; }
  .update-banner button{
    font-family: inherit; font-size: 15.6px; font-weight: 700; padding: 6px 14px; border-radius: 6px; cursor: pointer;

<script>
/* =========================================================================
   一、共用小工具
   ========================================================================= */

// 將民國年轉換為西元年 (例如 115 -> 2026)
function rocToWest(rocYear){ return rocYear + 1911; }
// 將西元年轉換為民國年 (例如 2026 -> 115)
function westToRoc(westYear){ return westYear - 1911; }

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

function showToast(message, isError){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (isError ? ' error' : '');
  el.textContent = message;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3600);
}

const CATEGORY_LABEL = { nurse: '護理師', assistant: '病房助理' };
const WEEKDAY_LABELS = ['日','一','二','三','四','五','六']; // 對應 JS Date.getDay() 的 0~6

/* =========================================================================
   二、領域模型 (Domain Model)
   把「月班表」想成一個資料夾：
     - 資料夾的標籤是「類別 + 西元年 + 月份」
     - 資料夾裡放著每一位員工的「個人班表卡」(員編、姓名、每天的班別代碼)
   之後查詢、匯入、儲存都是在操作這個資料夾，而不是直接兜 DOM 或表格字串。
   ========================================================================= */

// 一位員工在某個月份的個人班表卡
class Employee{
  constructor(empId, name){
    this.empId = empId;
    this.name = name;
    this.shifts = {}; // { 1:'D1', 2:'OFF', ... }，key 為當月的日期數字
  }
}

// 某個類別、某年某月的完整月班表
class MonthlySchedule{
  constructor(category, westYear, month){
    this.category = category;   // 'nurse' | 'assistant'
    this.westYear = westYear;   // 西元年，例如 2026
    this.month = month;         // 1~12
    this.employees = [];        // Employee[]
  }
  get rocYear(){ return westToRoc(this.westYear); }
  get daysInMonth(){ return new Date(this.westYear, this.month, 0).getDate(); }
  get storageKey(){
    return `schedule:${this.category}:${this.westYear}-${String(this.month).padStart(2,'0')}`;
  }
  // 計算某一天是星期幾（不依賴PDF裡的星期文字，避免解析誤差）
  weekdayOf(day){
    return WEEKDAY_LABELS[new Date(this.westYear, this.month - 1, day).getDay()];
  }
  toJSON(){
    return {
      category: this.category,
      westYear: this.westYear,
      month: this.month,
      employees: this.employees.map(e => ({ empId: e.empId, name: e.name, shifts: e.shifts }))
    };
  }
  static fromPlainObject(obj){
    const s = new MonthlySchedule(obj.category, obj.westYear, obj.month);
    s.employees = obj.employees.map(e => {
      const emp = new Employee(e.empId, e.name);
      emp.shifts = e.shifts || {};
      return emp;
    });
    return s;
  }
}

/* =========================================================================
   三、儲存層 (Repository)
   改用 Firebase Firestore 當雲端資料庫，取代原本只存在單一瀏覽器裡的
   localStorage——這樣不同電腦、不同瀏覽器開這個網頁，看到的都是同一份資料。
   上面的領域模型完全不用知道底層存的是 Firestore 還是別的東西。

   資料結構：一個 schedules 集合(collection)，每個文件(document)是
   一份「類別＋年＋月」的月班表，文件ID用 category-westYear-month 組成，
   例如 nurse-2026-09。
   ========================================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyCDoaGP0aeW7P1nhFas-4T3krVftiroG34",
  authDomain: "monthlyschedule-a5dea.firebaseapp.com",
  projectId: "monthlyschedule-a5dea",
  storageBucket: "monthlyschedule-a5dea.firebasestorage.app",
  messagingSenderId: "204422687469",
  appId: "1:204422687469:web:bfa6d1672fddbd576ffae4"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const SCHEDULES_COLLECTION = 'schedules';

/* =========================================================================
   三之一、登入驗證 (Firebase Authentication)
   在資料真的被讀寫之前，先擋一層登入畫面：只有登入成功的使用者，
   appRoot(整個班表系統畫面)才會顯示出來；沒登入前，畫面上只有登入表單，
   不會去呼叫任何 Firestore 的查詢/匯入功能。
   ========================================================================= */

const loginScreen = document.getElementById('loginScreen');
const appRoot = document.getElementById('appRoot');
const loginForm = document.getElementById('loginForm');
const loginEmailInput = document.getElementById('loginEmail');
const loginPasswordInput = document.getElementById('loginPassword');
const loginErrorEl = document.getElementById('loginError');
const btnLoginEl = document.getElementById('btnLogin');
const currentUserEmailEl = document.getElementById('currentUserEmail');
const btnLogoutEl = document.getElementById('btnLogout');

auth.onAuthStateChanged(user => {
  if(user){
    loginScreen.style.display = 'none';
    currentUserEmailEl.textContent = user.email || '';
    loginErrorEl.textContent = '';
    showOrgScreen(); // 帳號登入成功 → 先選公司／部門
  }else{
    loginScreen.style.display = '';
    appRoot.style.display = 'none';
    document.getElementById('orgScreen').style.display = 'none';
    leaveOrg();
  }
});

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = loginEmailInput.value.trim();
  const password = loginPasswordInput.value;
  loginErrorEl.textContent = '';
  btnLoginEl.disabled = true;
  btnLoginEl.textContent = '登入中...';
  try{
    await auth.signInWithEmailAndPassword(email, password);
    loginPasswordInput.value = '';
  }catch(err){
    // 把常見的 Firebase 錯誤代碼轉成看得懂的中文說明
    const code = err && err.code;
    const messages = {
      'auth/invalid-email': '帳號格式不正確',
      'auth/user-not-found': '查無此帳號',
      'auth/wrong-password': '密碼錯誤',
      'auth/invalid-credential': '帳號或密碼錯誤',
      'auth/too-many-requests': '嘗試登入次數過多，請稍後再試',
      'auth/network-request-failed': '網路連線失敗，請確認網路狀態'
    };
    loginErrorEl.textContent = messages[code] || ('登入失敗：' + (err.message || err));
  }finally{
    btnLoginEl.disabled = false;
    btnLoginEl.textContent = '登入';
  }
});

btnLogoutEl.addEventListener('click', () => auth.signOut());


/* =========================================================================
   三之二、組織（公司／部門）
   把整個系統想成一棟「醫院大樓」：
     - 大樓裡有好幾間「單位辦公室」(Organization = 公司＋部門)，每間有自己的門鎖密碼
     - 每間辦公室裡才各自放著「護理師」「病房助理」兩個班表櫃子
   Firebase 帳號登入 = 進大樓大門；選單位＋管理者密碼 = 打開某間辦公室的門。
   ========================================================================= */

const ORGS_COLLECTION = 'orgs';

// 原始單位：沿用既有的雲端資料（文件ID不加前綴，舊資料完全不用搬動）
const LEGACY_ORG_ID = 'default';
const DEFAULT_ORG_SEED = {
  id: LEGACY_ORG_ID,
  company: '臺北市立聯合醫院忠孝院區',
  department: '呼吸照護病房',
  initialPassword: 'Aa123456'
};

class Organization{
  constructor(id, company, department, passwordHash){
    this.id = id;
    this.company = company;
    this.department = department;
    this.passwordHash = passwordHash; // 只存雜湊值，不存明碼
  }
  get isLegacy(){ return this.id === LEGACY_ORG_ID; }
  get label(){ return `${this.company}／${this.department}`; }
  toJSON(){ return { company: this.company, department: this.department, passwordHash: this.passwordHash }; }
}

let currentOrg = null; // 目前進入的單位

// 密碼 → SHA-256 雜湊（十六進位字串）
async function hashPassword(pw){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('rcw-org:' + pw));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

const OrgRepository = {

const ScheduleRepository = {
  // 原始單位沿用舊的文件ID（例如 nurse-2026-09）；其他單位加上單位ID前綴，資料彼此分開
  docIdOf(category, westYear, month){
    const base = `${category}-${westYear}-${String(month).padStart(2, '0')}`;
    return (!currentOrg || currentOrg.isLegacy) ? base : `${currentOrg.id}__${base}`;
  },
  // 判斷一份雲端文件是否屬於目前單位
  belongsToCurrentOrg(data){
    if(!currentOrg || currentOrg.isLegacy) return !data.orgId;
    return data.orgId === currentOrg.id;
  },
  async load(category, westYear, month){
    try{
      const snap = await db.collection(SCHEDULES_COLLECTION).doc(this.docIdOf(category, westYear, month)).get();
      if(!snap.exists) return null;
      return MonthlySchedule.fromPlainObject(snap.data());
    }catch(err){
      console.error('讀取Firestore失敗:', err);
      return null; // 找不到這份文件，或連線失敗，都當作尚未有這個月份的資料
    }
  },
  async save(schedule){
    const docId = this.docIdOf(schedule.category, schedule.westYear, schedule.month);
    try{
      const payload = schedule.toJSON();
      if(currentOrg && !currentOrg.isLegacy) payload.orgId = currentOrg.id; // 標記所屬單位
      await db.collection(SCHEDULES_COLLECTION).doc(docId).set(payload);
    }catch(err){
      // 最常見原因：安全性規則不允許寫入、或網路離線
      throw new Error('雲端資料庫寫入失敗：' + (err.message || err));
    }
  },
  async remove(category, westYear, month){
    try{ await db.collection(SCHEDULES_COLLECTION).doc(this.docIdOf(category, westYear, month)).delete(); }
    catch(err){ console.error('刪除Firestore資料失敗:', err); }
  },
  // 讀取目前單位所有已儲存的月班表（不分類別），供XML匯出使用
  async loadAll(){
    try{
      const snapshot = await db.collection(SCHEDULES_COLLECTION).get();
      const schedules = [];
      snapshot.forEach(doc => {
        const data = doc.data();
        if(!this.belongsToCurrentOrg(data)) return; // 只取目前單位的資料
        try{ schedules.push(MonthlySchedule.fromPlainObject(data)); }
        catch(err){ /* 略過格式毀損的單筆資料 */ }
      });
      return schedules;
    }catch(err){
      console.error('讀取全部Firestore資料失敗:', err);
      return [];
    }
  }
};

/* =========================================================================
   四、PDF 解析模組
   實際測試發現：許多班表 PDF（多半是 Excel 匯出）欄位很窄，
   「員編」「姓名」這種兩字標籤會被拆成兩個字、各佔一行來顯示；
   員工姓名也常因為欄位塞不下，2個字在第一行、剩下的字擠到下一行，
   而且「員編」文字本身跟姓名兩行的相對位置，每個人還不一定一樣。
   因此不能只靠「同一列文字」來抓表格，改用下面的策略：
     1. 用日期欄的「9/1」「9/2」...文字，建立每天的欄位x座標錨點
        （這一列通常最完整、最不會被拆行，最適合當基準）
     2. 找出日期列正下方、由星期文字組成的「星期列」，
        它的y座標就是「表頭」與「員工資料」的分界線
     3. 在分界線以下，找出所有符合員編格式（如B2476）的文字，
        依上下順序切成一個一個「員工區塊」
     4. 區塊內 x 落在日期欄範圍的文字，視為班別代碼，
        用「離哪個日期錨點x最近」分配到對應日期
     5. 姓名欄位容易跨行、且跟員編的相對位置不穩定，因此姓名文字
        改用「離哪個員工的主要資料列(班別那一列)最近」來重新分配，
        才不會抓錯行、把姓名兜到隔壁員工身上
   ========================================================================= */

const PdfTableExtractor = {
  async extractPages(file){
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({
      data: buf,
      cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
      cMapPacked: true,
      standardFontDataUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/'
    }).promise;
    const pages = [];
    for(let p = 1; p <= pdf.numPages; p++){
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      const items = content.items
        .filter(it => it.str && it.str.trim() !== '')
        .map(it => ({ x: it.transform[4], y: it.transform[5], text: it.str.trim() }));
      pages.push(items);
    }
    return pages;
  },

  // 從整頁文字中，找出日期表頭列最集中的那一個y座標。
  // 有的醫院用「9/1」「9/2」這種完整日期格式，有的只用「1」「2」...「31」這種純數字格式，
  // 兩種都要能找到，才不會因為格式不同就整份PDF解析失敗。
  buildDateAnchors(items){
    // 優先找「9/1」這種完整日期格式(比較不會跟內文其他數字搞混)
    const slashDateItems = items.filter(it => /^\d{1,2}\/\d{1,2}$/.test(it.text));
    const slashResult = PdfTableExtractor.pickBestDateBucket(slashDateItems, it => {
      const m = it.text.match(/^(\d{1,2})\/(\d{1,2})$/);
      return parseInt(m[2], 10);
    });
    if(slashResult.anchors.length > 0) return slashResult;

    // 找不到完整日期格式時，改找「1」「2」...這種純數字格式的日期表頭列：
    // 要求同一列裡由左到右的數字嚴格遞增、而且從1開始，避免跟班表下方其他統計數字(例如每日人數小計)搞混
    const plainNumItems = items.filter(it => /^\d{1,2}$/.test(it.text));
    const plainGroups = PdfTableExtractor.clusterByY(plainNumItems, 1.5);
    let bestKey = null, bestSorted = [];
    for(const g of plainGroups){
      if(g.items.length < 20) continue; // 一整個月至少快30天，太少的不像日期表頭列
      const sorted = g.items.slice().sort((a, b) => a.x - b.x);
      if(parseInt(sorted[0].text, 10) !== 1) continue; // 日期一定從1號開始
      let increasing = true, prevVal = 0;
      for(const it of sorted){
        const v = parseInt(it.text, 10);
        if(v <= prevVal){ increasing = false; break; }
        prevVal = v;
      }
      if(!increasing) continue;
      if(sorted.length > bestSorted.length){ bestKey = g.y; bestSorted = sorted; }
    }
    if(bestSorted.length === 0) return { anchors: [], headerY: null };
    const anchors = bestSorted.map(it => ({ day: parseInt(it.text, 10), x: it.x }));
    return { anchors, headerY: bestKey };
  },

  // 共用：把一組文字依y座標聚成一列一列(容許些許誤差，避免剛好卡在四捨五入邊界被拆成兩列)
  clusterByY(items, tolerance){
    const sorted = items.slice().sort((a, b) => b.y - a.y);
    const groups = [];
    for(const it of sorted){
      let g = groups.find(g => Math.abs(g.y - it.y) < tolerance);
      if(!g){ g = { y: it.y, items: [] }; groups.push(g); }
      g.items.push(it);
    }
    return groups;
  },

  // 共用：在一組候選文字裡，找出同一個y座標出現最多次的那一列，當作日期表頭列
  pickBestDateBucket(dateItems, getDayFn){
    const groups = PdfTableExtractor.clusterByY(dateItems, 1.5);
    let best = null;
    for(const g of groups){
      if(!best || g.items.length > best.items.length) best = g;
    }
    if(!best) return { anchors: [], headerY: null };
    const anchors = best.items
      .map(it => ({ day: getDayFn(it), x: it.x }))
      .sort((a, b) => a.x - b.x);
    return { anchors, headerY: best.y };
  },

  // 找出日期列正下方、由星期文字組成的那一列的y座標，做為表頭與員工資料的分界線
  findHeaderCutoffY(items, headerY){
    if(headerY == null) return null;
    const weekdayChars = new Set(['日', '一', '二', '三', '四', '五', '六']);
    const belowHeader = items.filter(it => it.y < headerY - 1 && weekdayChars.has(it.text));
    if(belowHeader.length === 0) return headerY - 1; // 找不到星期列時，至少排除日期列本身
    return Math.max(...belowHeader.map(it => it.y)) - 1;
  },

  // 把日期欄位範圍內的班別代碼文字，依 y 座標聚成一列一列，一列就代表一位員工的資料列。
  // 不依賴「員編」是否存在——新進人員可能暫時還沒有員編，但只要那一列有排班，班別儲存格就一定存在，
  // 這樣才不會因為缺員編而整列資料被吃掉、或跟上一位員工的資料混在一起。
  groupShiftRows(shiftItems){
    const sorted = shiftItems.slice().sort((a, b) => b.y - a.y); // 由上而下
    const rows = [];
    for(const it of sorted){
      let row = rows.find(r => Math.abs(r.y - it.y) < 3);
      if(!row){ row = { y: it.y, items: [] }; rows.push(row); }
      row.items.push(it);
    }
    return rows;
  },

  // 把員編依「上下順序」配對到資料列：員編在PDF裡本來就跟資料列上下順序一致，
  // 但員編文字跟它那一列資料的y座標落差，每個人不一定完全固定(量測到有±9左右的誤差)，
  // 若只看「離哪一列最近」，可能會因為單一列的誤差而配到錯的列。
  // 改用「整體配對總落差最小」的方式一次算出全部配對(動態規劃)，同時允許某幾列沒有員編
  // (插在任何位置，不限最後一列——例如某個人從缺員編到有員編，是插在队伍中間)，才不會一個配錯、全部跟著錯位。
  alignIdsToRows(idsDesc, rowsDesc){
    const I = idsDesc.length, R = rowsDesc.length;
    const INF = Infinity;
    const dp = Array.from({ length: I + 1 }, () => new Array(R + 1).fill(INF));
    const choice = Array.from({ length: I + 1 }, () => new Array(R + 1).fill(null));
    for(let j = 0; j <= R; j++) dp[0][j] = 0;
    for(let i = 1; i <= I; i++){
      for(let j = i; j <= R; j++){ // j 必須 >= i，前面才塞得下 i 個員編
        const skip = dp[i][j - 1];
        const prev = dp[i - 1][j - 1];
        const matchCost = prev === INF ? INF : prev + Math.abs(idsDesc[i - 1].y - rowsDesc[j - 1].y);
        if(matchCost <= skip){ dp[i][j] = matchCost; choice[i][j] = 'match'; }
        else { dp[i][j] = skip; choice[i][j] = 'skip'; }
      }
    }
    const rowToId = new Array(R).fill(null);
    let i = I, j = R;
    while(i > 0 && j > 0){
      if(choice[i][j] === 'match'){ rowToId[j - 1] = idsDesc[i - 1]; i--; j--; }
      else { j--; }
    }
    return rowToId; // rowToId[k] = 配對到第k列(由上而下，k從0開始)的員編項目，或 null(這一列沒有員編)
  },

  /* -----------------------------------------------------------------------
     「直式／轉置版面」解析：
     有些醫院匯出的PDF，日期是由上而下排成一欄（而不是橫向表頭），
     員編／姓名則橫向排成表頭列，整張表等於是把原本的表格「轉90度」。
     這種版面无法用上面「日期橫向表頭」的邏輯找到日期錨點，
     因此改用「星期文字（日一二三四五六）由上而下連續出現一整個月」
     來偵測並定位每一天的資料列。
     ----------------------------------------------------------------------- */

  // 偵測垂直日期欄：星期文字(日一二三四五六)最集中的那個x座標，由上而下依序視為第1天、第2天...
  buildVerticalDateRows(items){
    const weekdayChars = new Set(['日', '一', '二', '三', '四', '五', '六']);
    const weekdayItems = items.filter(it => weekdayChars.has(it.text));
    if(weekdayItems.length < 20) return { rows: [], minDateY: null }; // 數量太少，不像一整個月的星期欄
    const buckets = new Map();
    for(const it of weekdayItems){
      const key = Math.round(it.x);
      if(!buckets.has(key)) buckets.set(key, []);
      buckets.get(key).push(it);
    }
    let bestList = [];
    for(const [, list] of buckets){
      if(list.length > bestList.length) bestList = list;
    }
    const rows = bestList
      .slice()
      .sort((a, b) => a.y - b.y)
      .map((it, idx) => ({ day: idx + 1, y: it.y }));
    const minDateY = rows.length ? Math.min(...rows.map(r => r.y)) : null;
    return { rows, minDateY };
  },

  // 偵測橫向的員編／姓名表頭欄位（在日期欄最上方那一段文字裡）
  buildVerticalColumns(items, minDateY){
    const headerItems = items.filter(it => it.y < minDateY - 5);
    const groups = [];
    for(const it of headerItems){
      let g = groups.find(g => Math.abs(g.y - it.y) < 4);
      if(!g){ g = { y: it.y, items: [] }; groups.push(g); }
      g.items.push(it);
    }
    const idRow = groups.find(g => g.items.some(it => EMP_ID_PATTERN.test(it.text)));
    if(!idRow) return [];
    const idCols = idRow.items.filter(it => EMP_ID_PATTERN.test(it.text)).sort((a, b) => a.x - b.x);
    const columns = idCols.map(idIt => ({ empId: idIt.text.trim(), x: idIt.x, nameParts: [] }));

    // 其餘表頭文字（扣掉「員編」「姓名」等標籤）視為姓名候選，依x座標分配給最近的欄位
    for(const g of groups){
      if(g === idRow) continue;
      for(const it of g.items){
        if(it.text === '員編' || it.text === '姓名') continue;
        let best = null, bestDist = Infinity;
        for(const col of columns){
          const dist = Math.abs(col.x - it.x);
          if(dist < bestDist){ bestDist = dist; best = col; }
        }
        if(best) best.nameParts.push(it);
      }
    }
    for(const col of columns){
      col.nameParts.sort((a, b) => a.x - b.x);
      col.name = col.nameParts.map(it => it.text).join('').trim();
    }
    return columns;
  },

  // 把每一列（每一天）落在欄位x座標附近的文字，分配為該員工當天的班別代碼
  assignVerticalShifts(items, rows, columns){
    if(columns.length === 0) return;
    const weekdayChars = new Set(['日', '一', '二', '三', '四', '五', '六']);
    const minColX = Math.min(...columns.map(c => c.x)) - 6; // 排除日期欄與星期欄本身
    const valueItems = items.filter(it =>
      it.x >= minColX && !/^\d{1,2}\/\d{1,2}/.test(it.text) && !weekdayChars.has(it.text)
    );
    for(const row of rows){
      // 容許上下約7個單位的誤差（同一天的班別代碼有時會因字型高度被拆成上下兩小段）
      const rowItems = valueItems.filter(it => it.y >= row.y - 7 && it.y <= row.y + 7);
      for(const it of rowItems){
        let best = null, bestDist = Infinity;
        for(const col of columns){
          const dist = Math.abs(it.x - col.x);
          if(dist < bestDist){ bestDist = dist; best = col; }
        }
        if(best) best.shifts[row.day] = (best.shifts[row.day] || '') + it.text;
      }
    }
  }
};

// 從PDF全部文字中，偵測年份與月份（同時支援西元 2026/09 與民國 115/09、115年9月 等格式）
// 注意：文字要「不含空白」串接，否則像「115 年 09 月」這種被拆成多個文字物件的標題會比對不到
function detectYearMonth(fullText){
  const m = fullText.match(/(\d{3,4})[\/\-\.年](\d{1,2})\s*月?/);
  if(!m) return { westYear: null, month: null };
  let year = parseInt(m[1], 10);
  const month = parseInt(m[2], 10);
  if(year < 1000) year += 1911; // 3位數視為民國年，轉換為西元年
  if(month < 1 || month > 12) return { westYear: null, month: null };
  return { westYear: year, month };
}

const EMP_ID_PATTERN = /^[A-Za-z]{1,2}\d{3,6}$/; // 員編格式，例如 B2476

// 主流程：把PDF解析成一份 MonthlySchedule
async function parsePdfToSchedule(file, category){
  const pages = await PdfTableExtractor.extractPages(file);
  const fullText = pages.flat().map(i => i.text).join(''); // 不加空白，避免拆開的標題文字比對不到

  const employees = [];
  let detected = { westYear: null, month: null };
  let newEmployeeSeq = 0; // 給還沒有員編的新進人員編暫時代號用(NEW1, NEW2, ...)，整份PDF共用同一組序號

  for(const items of pages){
    if(items.length === 0) continue;
    const { anchors, headerY } = PdfTableExtractor.buildDateAnchors(items);

    // 門檻設為5：避免日期直向排列的版面中，剛好有1～少數幾個日期巧合落在同一個y座標，
    // 被誤判成「只有1～少數幾欄」的橫向日期表頭，導致誤用版面一的邏輯去解析版面二的PDF
    if(anchors.length >= 5){
      // ---- 版面一：日期橫向排成表頭列，員工由上而下排列 ----

      // 年月只在「日期表頭列以上」的文字裡找（也就是標題那一小段），
      // 避免日期資料本身互相接續(例如 9/9 接 9/10 變成 ...9/9|9/10...)巧合湊出看似合法的年月而誤判
      if(detected.westYear == null && headerY != null){
        const titleText = items.filter(it => it.y > headerY + 1).map(it => it.text).join('');
        detected = detectYearMonth(titleText);
      }

      const firstDateX = anchors[0].x - 8; // 日期欄最左側再留一點緩衝，做為姓名欄與日期欄的分界
      // 日期欄最右側也要有邊界：有些PDF在最後一天的日期欄位之後，還會有「簽名欄(重複姓名)」、
      // 「事假/病假/公假/喪假時數」等統計欄位，範圍要排除，不然這些內容會被誤認成班別代碼
      const colSpacing = anchors.length > 1
        ? (anchors[anchors.length - 1].x - anchors[0].x) / (anchors.length - 1)
        : 20;
      const lastDateX = anchors[anchors.length - 1].x + colSpacing / 2;
      const cutoffY = PdfTableExtractor.findHeaderCutoffY(items, headerY);

      // 用班別代碼本身的y座標聚成一列一列，一列＝一位員工（見 groupShiftRows 說明：
      // 不依賴員編是否存在，所以新進人員就算還沒有員編，也不會被吃掉或跟別人混在一起）
      const shiftItemsAll = items.filter(it => it.y < cutoffY && it.x >= firstDateX && it.x <= lastDateX);
      const rows = PdfTableExtractor.groupShiftRows(shiftItemsAll).sort((a, b) => b.y - a.y); // 由上而下

      // 員編／姓名候選字：都在日期欄左側，員編是固定格式，姓名是其餘文字。
      // 排除規則：
      // 1) 含數字的字串都排除，例如有些PDF姓名欄左邊還有一欄「序號1、2、3...」(純數字)，
      //    或是「9月30日」上月最後一天的帶班別參考欄(例如「1D」「3N」「2OFF」，混合數字字母)，
      //    這些都不是姓名的一部分
      // 2) 單一個中文字且屬於常見休假/班別代碼者(例如「例」)也排除——這通常是上述參考欄的值
      // 3) x座標要在「員編欄」右側才算姓名候選字：有些PDF員編欄左邊還有「編號」「專業進階(丙/照/
      //    臨床/教師)」「單位支援(七東支援)」之類的註記欄，這些都比員編欄更靠左，不是姓名的一部分
      const NON_NAME_SINGLE_CHARS = new Set(['例', '國', '休', '公', '喪', '事', '病', '產', '假', '白', '值', '夜']);
      const empIdCandidates = items.filter(it => it.y < cutoffY && it.x < firstDateX && EMP_ID_PATTERN.test(it.text));
      const idRefX = empIdCandidates.length > 0 ? Math.min(...empIdCandidates.map(it => it.x)) : null;
      const nameMinX = idRefX != null ? idRefX + 5 : -Infinity;
      const nameCandidates = items.filter(it =>
        it.y < cutoffY && it.x < firstDateX && it.x > nameMinX &&
        !EMP_ID_PATTERN.test(it.text) && !/\d/.test(it.text) &&
        !(it.text.length === 1 && NON_NAME_SINGLE_CHARS.has(it.text))
      );

      // 依「上下順序＋整體落差最小」把員編配對到資料列，而不是單純比對單一列的距離
      // (見 alignIdsToRows 說明：這樣才不會因為某一列的員編位置有誤差，就整批配錯)
      const idsDesc = empIdCandidates.slice().sort((a, b) => b.y - a.y);
      const rowToId = PdfTableExtractor.alignIdsToRows(idsDesc, rows);

      for(let k = 0; k < rows.length; k++){
        const row = rows[k];
        row.shiftItems = row.items.sort((a, b) => a.x - b.x);
        row.nameFragments = [];
        row.empId = rowToId[k] ? rowToId[k].text.trim() : null; // 配不到員編就代表這一列目前沒有員編(例如剛到職、還沒建檔的新進人員)
      }

      // 姓名候選字：因為員編(或這一列本身)跟姓名的相對位置每個人不太一樣，改成整頁蒐集後，
      // 依「離哪一列最近」重新分配，而不是依員編位置切出的區塊分配
      for(const cand of nameCandidates){
        let best = null, bestDist = Infinity;
        for(const row of rows){
          const diff = row.y - cand.y; // 正值代表候選字在這一列下方
          if(diff < -5 || diff > 25) continue; // 只接受這一列上方一點點、或下方最多約一行高度的範圍
          if(diff < bestDist){ bestDist = diff; best = row; }
        }
        if(best) best.nameFragments.push(cand);
      }

      // 表格下方常常還有簽名欄、休假時數統計、圖例說明(例如「D=白班 E=小夜 N=大夜」)、
      // 「出勤/備註」「加班時數」等額外註記列，這些列不屬於真正的員工資料列，要濾掉；
      // 判斷依據：沒有員編、姓名也不像一個正常的中文姓名
      // (真實姓名是2~8個純中文字，不會是單一英文字母、空白，或帶標點符號的說明文字)
      const PLAUSIBLE_NAME_PATTERN = /^[一-龥]{2,8}$/;

      for(const row of rows){
        row.nameFragments.sort((a, b) => (b.y - a.y) || (a.x - b.x)); // 由上而下、同一行由左而右
        row.resolvedName = row.nameFragments.map(it => it.text).join('').trim();
      }

      // 有些PDF會在日期欄最右側(簽名欄)把姓名重複印一次；這個規律可以拿來二次驗證「沒有員編」
      // 的列是不是真的員工(例如剛到職、姓名碰巧是2~8個中文字的「出勤」「備註」「加班時數」等
      // 註記列，也會通過上面的姓名格式判斷，但這些列在簽名欄不會出現對應的姓名文字)
      const signatureCandidates = items.filter(it => it.y < cutoffY && it.x > lastDateX && PLAUSIBLE_NAME_PATTERN.test(it.text));
      const sigXGroups = new Map();
      for(const it of signatureCandidates){
        const key = Math.round(it.x);
        if(!sigXGroups.has(key)) sigXGroups.set(key, []);
        sigXGroups.get(key).push(it);
      }
      let sigColumn = null;
      for(const list of sigXGroups.values()){
        if(!sigColumn || list.length > sigColumn.length) sigColumn = list;
      }
      const hasSignatureColumn = sigColumn && sigColumn.length >= 3; // 至少三列才當作有簽名欄規律，避免誤判

      const validRows = rows.filter(row => {
        if(row.empId) return true; // 有員編的一定算
        if(!PLAUSIBLE_NAME_PATTERN.test(row.resolvedName)) return false;
        if(!hasSignatureColumn) return true; // 沒有簽名欄規律可用時，只能依賴姓名格式判斷
        return sigColumn.some(it => Math.abs(it.y - row.y) < 10 && it.text === row.resolvedName);
      });

      for(const row of validRows){
        const name = row.resolvedName;

        const shifts = {};
        for(const it of row.shiftItems){
          let best = null, bestDist = Infinity;
          for(const a of anchors){
            const dist = Math.abs(it.x - a.x);
            if(dist < bestDist){ bestDist = dist; best = a; }
          }
          if(!best) continue;
          shifts[best.day] = (shifts[best.day] || '') + it.text;
        }

        // 還沒有員編的人（例如剛到職、還沒建檔的新進人員），先給一個暫時代號，
        // 之後正式有員編了，可以再用「編輯班別代碼」以外的方式手動補上(或等下次匯入覆蓋)
        let empId = row.empId;
        if(!empId){
          newEmployeeSeq++;
          empId = `NEW${newEmployeeSeq}`;
        }

        const emp = new Employee(empId, name);
        emp.shifts = shifts;
        employees.push(emp);
      }
      continue;
    }

    // ---- 版面二：日期直向排成一欄，員編／姓名橫向排成表頭（整張表等於轉90度） ----
    const { rows, minDateY } = PdfTableExtractor.buildVerticalDateRows(items);
    if(rows.length === 0) continue; // 兩種版面都偵測不到，可能不是班表內容，略過

    const columns = PdfTableExtractor.buildVerticalColumns(items, minDateY);
    if(columns.length === 0) continue;

    for(const col of columns) col.shifts = {};
    PdfTableExtractor.assignVerticalShifts(items, rows, columns);

    for(const col of columns){
      const emp = new Employee(col.empId, col.name);
      emp.shifts = col.shifts;
      employees.push(emp);
    }
  }

  // 這種版面的PDF內文常常沒有年月標題文字，退而求其次改從檔名辨識
  // （例如「RCW-115年10月護理師班表.pdf」）
  if(detected.westYear == null){
    detected = detectYearMonth(file.name || '');
  }

  // 同一員編若跨頁出現（例如分頁延續），合併其班別資料
  const merged = new Map();
  for(const e of employees){
    if(merged.has(e.empId)) Object.assign(merged.get(e.empId).shifts, e.shifts);
    else merged.set(e.empId, e);
  }

  const schedule = new MonthlySchedule(category, detected.westYear, detected.month);
  schedule.employees = Array.from(merged.values());

  // 類別比對同樣可能因內文沒有文字而找不到，所以也把檔名一併納入判斷
  const combinedText = fullText + (file.name || '');
  const oppositeKeyword = category === 'nurse' ? '病房助理' : '護理師';
  const categoryMismatch = combinedText.includes(oppositeKeyword) && !combinedText.includes(CATEGORY_LABEL[category]);

  return { schedule, categoryMismatch, rowsFound: employees.length };
}

/* =========================================================================
   四之二、Excel (.xlsx) 解析模組
   有些醫院的班表PDF其實是「掃描圖檔」，沒有可抽取的文字層，
   pdf.js 抓不到任何文字、上面的PDF解析流程會直接失敗。
   這種情況建議先用外部工具（例如華為雲「通用表格識別」OCR服務、
   或你參考的 pdf2excel 專案）把PDF轉成 Excel，再把 Excel 匯入這裡。
   Excel本身就有規整的儲存格結構，不需要像PDF那樣用座標去猜欄位，
   直接讀「列、欄」即可；邏輯比PDF解析單純很多。
   ========================================================================= */

async function parseExcelToSchedule(file, category){
  const buf = await file.arrayBuffer();
  const workbook = XLSX.read(buf, { type: 'array' });

  // 有些轉檔結果會把PDF每一頁存成獨立的工作表(sheet)，所以要逐一掃描所有分頁
  const allSheetRows = workbook.SheetNames.map(name =>
    XLSX.utils.sheet_to_json(workbook.Sheets[name], { header: 1, raw: false, defval: '' })
  );

  const fullText = allSheetRows.flat(2).join('');
  const detected = detectYearMonth(fullText);

  const employees = [];

  for(const rows of allSheetRows){
    // 找出同時含有「員編」與「姓名」的表頭列
    const headerIdx = rows.findIndex(row => {
      const text = row.join('');
      return text.includes('員編') && text.includes('姓名');
    });
    if(headerIdx === -1) continue;
    const header = rows[headerIdx];

    // 建立欄位對照：欄位索引 -> 'empId' | 'name' | 日期數字
    const colMap = {};
    header.forEach((cellText, colIdx) => {
      const text = String(cellText || '').trim();
      const m = text.match(/^(\d{1,2})\/(\d{1,2})$/);
      if(m) colMap[colIdx] = parseInt(m[2], 10);
      else if(text.includes('員編')) colMap[colIdx] = 'empId';
      else if(text.includes('姓名')) colMap[colIdx] = 'name';
    });

    for(let r = headerIdx + 1; r < rows.length; r++){
      const row = rows[r];
      const empIdCol = Object.keys(colMap).find(c => colMap[c] === 'empId');
      const nameCol = Object.keys(colMap).find(c => colMap[c] === 'name');
      const empId = empIdCol !== undefined ? String(row[empIdCol] || '').trim() : '';
      if(!EMP_ID_PATTERN.test(empId)) continue;

      const emp = new Employee(empId, nameCol !== undefined ? String(row[nameCol] || '').trim() : '');
      for(const colIdx of Object.keys(colMap)){
        const key = colMap[colIdx];
        if(key === 'empId' || key === 'name') continue;
        const val = String(row[colIdx] || '').trim();
        if(val) emp.shifts[key] = val;
      }
      employees.push(emp);
    }
  }

  const merged = new Map();
  for(const e of employees){
    if(merged.has(e.empId)) Object.assign(merged.get(e.empId).shifts, e.shifts);
    else merged.set(e.empId, e);
  }

  const schedule = new MonthlySchedule(category, detected.westYear, detected.month);
  schedule.employees = Array.from(merged.values());

  const oppositeKeyword = category === 'nurse' ? '病房助理' : '護理師';
  const categoryMismatch = fullText.includes(oppositeKeyword) && !fullText.includes(CATEGORY_LABEL[category]);

  return { schedule, categoryMismatch, rowsFound: employees.length };
}

/* =========================================================================
   四之一、XML 備份 / 還原
   格式參考既有系統的做法（屬性式 XML、逐一逸出特殊字元），
   並依本系統的資料結構調整：每份 <schedule> 多帶一個 category 屬性，
   員工與班別以巢狀方式表示，對應 MonthlySchedule -> Employee -> shifts 的結構。

   <scheduleSystem>
     <schedules>
       <schedule category="nurse" year="2026" month="9">
         <employee empId="B2476" name="夏盈珍">
           <entry day="1" shift="D1"/>
           ...
         </employee>
       </schedule>
     </schedules>
   </scheduleSystem>
   ========================================================================= */

function xmlEscape(s){
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

// 將多份 MonthlySchedule 序列化為 XML 字串
function serializeSchedulesToXml(schedules){
  const orgAttr = currentOrg
    ? ` company="${xmlEscape(currentOrg.company)}" department="${xmlEscape(currentOrg.department)}"`
    : '';
  const lines = ['<?xml version="1.0" encoding="UTF-8"?>', `<scheduleSystem${orgAttr}>`, '  <schedules>'];
  for(const s of schedules){
    lines.push(`    <schedule category="${xmlEscape(s.category)}" year="${s.westYear}" month="${s.month}">`);
    for(const emp of s.employees){
      lines.push(`      <employee empId="${xmlEscape(emp.empId)}" name="${xmlEscape(emp.name)}">`);
      for(const day of Object.keys(emp.shifts)){
        const shift = emp.shifts[day];
        if(shift) lines.push(`        <entry day="${day}" shift="${xmlEscape(shift)}"/>`);
      }
      lines.push('      </employee>');
    }
    lines.push('    </schedule>');
  }
  lines.push('  </schedules>', '</scheduleSystem>');
  return lines.join('\n');
}

// 從 XML 字串解析出多份 MonthlySchedule
function parseXmlToSchedules(xmlStr){
  const doc = new DOMParser().parseFromString(xmlStr, 'text/xml');
  if(doc.querySelector('parsererror')) throw new Error('XML格式錯誤，請確認檔案內容');

  const schedules = [];
  doc.querySelectorAll('schedule').forEach(schEl => {
    const category = schEl.getAttribute('category');
    const westYear = parseInt(schEl.getAttribute('year'), 10);
    const month = parseInt(schEl.getAttribute('month'), 10);
    if((category !== 'nurse' && category !== 'assistant') || !westYear || !month) return;

    const schedule = new MonthlySchedule(category, westYear, month);
    schEl.querySelectorAll('employee').forEach(empEl => {
      const emp = new Employee(empEl.getAttribute('empId') || '', empEl.getAttribute('name') || '');
      empEl.querySelectorAll('entry').forEach(enEl => {
        const day = enEl.getAttribute('day');
        const shift = enEl.getAttribute('shift');
        if(day && shift) emp.shifts[day] = shift;
      });
      schedule.employees.push(emp);
    });
    schedules.push(schedule);
  });
  return schedules;
}

// 匯出：把儲存空間內所有月班表打包成一份 XML 檔案並下載
async function exportXmlBackup(){
  const schedules = await ScheduleRepository.loadAll();
  if(schedules.length === 0){ showToast('目前沒有任何班表資料可以匯出', true); return; }

  const xml = serializeSchedulesToXml(schedules);
  const d = new Date();
  const fileName = `月班表備份_${currentOrg ? currentOrg.department + '_' : ''}${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.xml`;

  // iPhone／iPad App：交給 iOS 分享選單（儲存到檔案、AirDrop、LINE、郵件…）
  if(window.RcwIOS && window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.rcw){
    try{
      const r = await window.webkit.messageHandlers.rcw.postMessage({ cmd: 'save_file', args: { name: fileName, text: xml } });
      if(r && r.status === 'ok') showToast(`已匯出 ${schedules.length} 個月份的班表資料`);
      else if(r && r.status === 'error') showToast('匯出失敗：' + (r.message || ''), true);
    }catch(err){ showToast('匯出失敗：' + (err.message || err), true); }
    return;
  }

  const blob = new Blob([xml], { type: 'application/xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast(`已匯出 ${schedules.length} 個月份的班表資料`);
}

// 匯入：讀取XML檔案，若有月份已存在資料先詢問是否覆蓋，再逐筆寫入儲存空間
async function importXmlBackup(file){
  let schedules;
  try{
    const text = await file.text();
    schedules = parseXmlToSchedules(text);
  }catch(err){
    showToast('XML檔案格式錯誤：' + (err.message || err), true);
    return;
  }
  if(schedules.length === 0){ showToast('這份XML檔案內沒有可用的班表資料', true); return; }

  // 檢查備份檔是否屬於目前單位，避免把別的部門資料匯進來
  try{
    const rootEl = new DOMParser().parseFromString(await file.text(), 'text/xml').documentElement;
    const xc = rootEl.getAttribute('company'), xd = rootEl.getAttribute('department');
    if(currentOrg && xd && (xc !== currentOrg.company || xd !== currentOrg.department)){
      const go = confirm(`這份備份屬於「${xc}／${xd}」，\n目前所在單位是「${currentOrg.label}」。\n確定要匯入到目前單位嗎？`);
      if(!go) return;
    }
  }catch(e){ /* 舊格式備份沒有單位資訊，略過檢查 */ }

  const existing = await ScheduleRepository.loadAll();
  const existingKeys = new Set(existing.map(s => s.storageKey));
  const conflictCount = schedules.filter(s => existingKeys.has(s.storageKey)).length;
  if(conflictCount > 0){
    const ok = confirm(`匯入的資料中有 ${conflictCount} 個月份已經有資料，匯入後將會覆蓋，確定要繼續嗎？`);
    if(!ok) return;
  }

  for(const s of schedules) await ScheduleRepository.save(s);
  showToast(`已匯入 ${schedules.length} 個月份的班表資料`);

  // 若目前已開啟的類別工作區正好顯示同一頁面，重新查詢一次以更新畫面
  Object.keys(workspacesBuilt).forEach(cat => {
    if(!workspacesBuilt[cat]) return;
    const root = document.getElementById(`workspace-${cat}`);
    const queryBtn = root && root.querySelector('.btn-query');
    if(queryBtn) queryBtn.click();
  });
}

/* =========================================================================
   五、畫面渲染
   ========================================================================= */

function shiftClass(code){
  if(!code) return 'shift-empty';
  if(code.startsWith('OFF')) return 'shift-off';
  if(code.startsWith('D') || code.includes('白值')) return 'shift-d';
  if(code.startsWith('E')) return 'shift-e';
  if(code.startsWith('N') || code.includes('夜8')) return 'shift-n';
  return 'shift-other';
}

/* =========================================================================
   統計規則（依需求文件定義）：看代碼「內容中是否含有」對應字元/字串，
   不要求完全相等，例如 D/W、D/學 都算 D白班，OFF、國、休、例 都算 OFF休假。
   （「例」＝例假，是台灣勞基法常見的休假代碼，跟 OFF/國/休 一樣都算休假天數）
   ========================================================================= */
function isDayShiftCode(code){ return !!code && (code.includes('D') || code.includes('白值')); }
function isEveningShiftCode(code){ return !!code && code.includes('E'); }
function isNightShiftCode(code){ return !!code && (code.includes('N') || code.includes('夜8')); }
function isOffShiftCode(code){
  if(!code) return false;
  return code.toLowerCase().includes('off') || code.includes('國') || code.includes('休') || code.includes('例');
}

// 全員班表下方的「統計」列：逐日計算 D白班/E小夜/N大夜 各有幾位員工是該班別，
// 並在最下面加一列「合計」= 當天 D+E+N 三種班別人數的總和，等於當天總共有多少人上班
function buildGroupStatRows(schedule, days){
  const countOf = (predicate) => days.map(d => schedule.employees.filter(e => predicate(e.shifts[d])).length);
  const dCounts = countOf(isDayShiftCode);
  const eCounts = countOf(isEveningShiftCode);
  const nCounts = countOf(isNightShiftCode);
  const totalCounts = days.map((_, i) => dCounts[i] + eCounts[i] + nCounts[i]);

  const rowCells = (counts, extraClass = '') => counts.map(c => `<td class="stat-count ${extraClass}">${c}</td>`).join('');

  const dividerRow = `<tr class="stat-row stat-divider"><td class="col-id stat-row-label">統計</td><td class="col-name"></td>${days.map(() => '<td></td>').join('')}</tr>`;
  const dRow = `<tr class="stat-row"><td class="col-id"></td><td class="col-name stat-row-label">D白班</td>${rowCells(dCounts)}</tr>`;
  const eRow = `<tr class="stat-row"><td class="col-id"></td><td class="col-name stat-row-label">E小夜</td>${rowCells(eCounts)}</tr>`;
  const nRow = `<tr class="stat-row"><td class="col-id"></td><td class="col-name stat-row-label">N大夜</td>${rowCells(nCounts)}</tr>`;
  const totalRow = `<tr class="stat-row stat-total"><td class="col-id"></td><td class="col-name stat-row-label">合計</td>${rowCells(totalCounts, 'stat-total-count')}</tr>`;
  return dividerRow + dRow + eRow + nRow + totalRow;
}

function renderScheduleTable(schedule){
  const days = Array.from({ length: schedule.daysInMonth }, (_, i) => i + 1);

  const dateHeaderCells = days.map(d => `<th>${schedule.month}/${d}</th>`).join('');
  const weekHeaderCells = days.map(d => {
    const wd = schedule.weekdayOf(d);
    const isWeekend = (wd === '六' || wd === '日');
    return `<th class="${isWeekend ? 'weekend' : ''}">${wd}</th>`;
  }).join('');

  const bodyRows = schedule.employees.map(emp => {
    const cells = days.map(d => {
      const code = emp.shifts[d] || '';
      return `<td class="shift editable-shift ${shiftClass(code)}" data-empid="${escapeHtml(emp.empId)}" data-day="${d}" title="點擊修改班別代碼">${escapeHtml(code)}</td>`;
    }).join('');
    return `<tr><td class="col-id">${escapeHtml(emp.empId)}</td><td class="col-name clickable-name" data-empid="${escapeHtml(emp.empId)}" title="點擊查看個人月班表">${escapeHtml(emp.name)}</td>${cells}</tr>`;
  }).join('');

  const statRows = buildGroupStatRows(schedule, days);

  return `
    <table class="schedule-table">
      <thead>
        <tr><th class="col-id">員編</th><th class="col-name">姓名</th>${dateHeaderCells}</tr>
        <tr><th class="col-id"></th><th class="col-name"></th>${weekHeaderCells}</tr>
      </thead>
      <tbody>${bodyRows}</tbody>
      <tfoot>${statRows}</tfoot>
    </table>`;
}

// 個人月班表下方的小計表：統計這個人整個月 D白班/E小夜/N大夜/OFF休假 各出現幾天
function renderPersonalStatTable(emp, daysInMonth){
  const days = Array.from({ length: daysInMonth }, (_, i) => i + 1);
  const countD = days.filter(d => isDayShiftCode(emp.shifts[d])).length;
  const countE = days.filter(d => isEveningShiftCode(emp.shifts[d])).length;
  const countN = days.filter(d => isNightShiftCode(emp.shifts[d])).length;
  const countOff = days.filter(d => isOffShiftCode(emp.shifts[d])).length;

  return `
    <table class="personal-stat-table">
      <thead><tr><th></th><th>D白班</th><th>E小夜</th><th>N大夜</th><th>OFF休假</th></tr></thead>
      <tbody><tr><td class="stat-row-label">統計</td><td class="stat-count">${countD}</td><td class="stat-count">${countE}</td><td class="stat-count">${countN}</td><td class="stat-count">${countOff}</td></tr></tbody>
    </table>`;
}

// 個人月班表：以「星期幾」排成一格一格的月曆樣式，可依 weekStartIndex(0=日~6=六) 調整每週從哪天開始
function renderPersonalCalendarTable(schedule, emp, weekStartIndex){
  const daysInMonth = schedule.daysInMonth;

  // 依起始星期重新排序表頭：例如起始選「星期一」，表頭就會是 一二三四五六日
  const orderedWeekdayIdx = Array.from({ length: 7 }, (_, i) => (weekStartIndex + i) % 7);
  const headerCells = orderedWeekdayIdx.map(idx => {
    const isWeekend = (idx === 0 || idx === 6); // 原始的日(0)、六(6)，不受排序影響，仍視為週末
    return `<th class="${isWeekend ? 'weekend' : ''}">${WEEKDAY_LABELS[idx]}</th>`;
  }).join('');

  // 把每一天依「離起始星期幾天」算出它落在這一週的第幾欄，湊成一列一列的月曆
  const rows = [];
  let currentRow = new Array(7).fill(null);
  for(let d = 1; d <= daysInMonth; d++){
    const weekdayIdx = new Date(schedule.westYear, schedule.month - 1, d).getDay();
    const col = (weekdayIdx - weekStartIndex + 7) % 7;
    currentRow[col] = d;
    if(col === 6){
      rows.push(currentRow);
      currentRow = new Array(7).fill(null);
    }
  }
  if(currentRow.some(v => v !== null)) rows.push(currentRow);

  const bodyRows = rows.map(row => {
    const cells = row.map(day => {
      if(day == null) return `<td class="cal-empty"></td>`;
      const code = emp.shifts[day] || '';
      return `<td class="cal-day ${shiftClass(code)}">
        <div class="cal-day-num">${day}</div>
        <div class="cal-day-shift">${escapeHtml(code)}</div>
      </td>`;
    }).join('');
    return `<tr>${cells}</tr>`;
  }).join('');

  return `<table class="calendar-table"><thead><tr>${headerCells}</tr></thead><tbody>${bodyRows}</tbody></table>`;
}

const LEGEND_HTML = `
  <div class="legend">
    <span><span class="swatch" style="background:var(--shift-d-bg);border:1px solid var(--shift-d)"></span>白班 (D)</span>
    <span><span class="swatch" style="background:var(--shift-e-bg);border:1px solid var(--shift-e)"></span>小夜 (E)</span>
    <span><span class="swatch" style="background:var(--shift-n-bg);border:1px solid var(--shift-n)"></span>大夜 (N)</span>
    <span><span class="swatch" style="background:var(--shift-off-bg);border:1px solid var(--shift-off)"></span>休假 (OFF)</span>
    <span><span class="swatch" style="background:var(--shift-other-bg);border:1px solid var(--shift-other)"></span>其他代碼</span>

          <h2 class="personal-title" style="border:none; padding:0; margin:0;"></h2>
          <button type="button" class="btn btn-ghost btn-next-emp" title="下一筆">下一筆 ▶</button>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">

          <select class="week-start-select">
            <option value="0">星期日</option>
            <option value="1">星期一</option>
            <option value="2">星期二</option>
            <option value="3">星期三</option>
            <option value="4">星期四</option>
            <option value="5">星期五</option>
            <option value="6">星期六</option>

      </div>

        這種情況請改用下方的 Excel 匯入：先用 OCR 工具（例如華為雲「通用表格識別」服務，或您參考的 pdf2excel 專案）
        把 PDF 轉成 .xlsx 檔，再上傳到這裡。

function initWorkspace(category){
  const root = document.getElementById(`workspace-${category}`);
  root.innerHTML = buildWorkspaceMarkup(category);

  const rocYearInput = root.querySelector('.roc-year-input');
  const monthSelect = root.querySelector('.month-select');
  const resultArea = root.querySelector('.result-area');
  const pdfInput = root.querySelector('.pdf-input');
  const excelInput = root.querySelector('.excel-input');
  const importPreview = root.querySelector('.import-preview');
  const importWarningSlot = root.querySelector('.import-warning-slot');
  const importRocYear = root.querySelector('.import-roc-year');
  const importMonth = root.querySelector('.import-month');
  const previewSummary = root.querySelector('.preview-summary');
  const previewTableArea = root.querySelector('.preview-table-area');
  const overwriteWarningSlot = root.querySelector('.overwrite-warning-slot');
  const personalPanel = root.querySelector('.personal-panel');
  const personalTitle = root.querySelector('.personal-title');
  const weekStartSelect = root.querySelector('.week-start-select');
  const personalCalendarArea = root.querySelector('.personal-calendar-area');
  const btnPrevEmp = root.querySelector('.btn-prev-emp');
  const btnNextEmp = root.querySelector('.btn-next-emp');

  let pendingSchedule = null; // 使用者確認前，暫存解析出來的班表
  let currentSchedule = null; // 目前查詢區顯示中的月班表，供點選姓名查看個人班表使用
  let currentEmpId = null;    // 目前個人班表面板顯示的是哪一位員工
  let currentWeekStart = 0;   // 每週起始星期(0=日,1=一,...6=六)，切換類別/查詢時不重置，維持使用者上次的選擇

  function hidePersonalPanel(){
    personalPanel.style.display = 'none';
    currentEmpId = null;
  }

  function renderPersonalPanel(){
    if(!currentSchedule || !currentEmpId) return;
    const employees = currentSchedule.employees;
    const index = employees.findIndex(e => e.empId === currentEmpId);
    const emp = employees[index];
    if(!emp){ hidePersonalPanel(); return; }
    personalTitle.textContent = `${currentSchedule.westYear}年${currentSchedule.month}月${emp.name}月班表`;
    personalCalendarArea.innerHTML = `<div class="calendar-scroll">${renderPersonalCalendarTable(currentSchedule, emp, currentWeekStart)}</div>${renderPersonalStatTable(emp, currentSchedule.daysInMonth)}`;
    // 頭尾各自停用上一筆/下一筆按鈕，不循環跳到另一端，避免使用者搞不清楚目前在哪一位
    btnPrevEmp.disabled = (index <= 0);
    btnNextEmp.disabled = (index === -1 || index >= employees.length - 1);
  }

  btnPrevEmp.addEventListener('click', () => {
    if(!currentSchedule) return;
    const index = currentSchedule.employees.findIndex(e => e.empId === currentEmpId);
    if(index > 0){
      currentEmpId = currentSchedule.employees[index - 1].empId;
      renderPersonalPanel();
    }
  });

  btnNextEmp.addEventListener('click', () => {
    if(!currentSchedule) return;
    const index = currentSchedule.employees.findIndex(e => e.empId === currentEmpId);
    if(index !== -1 && index < currentSchedule.employees.length - 1){
      currentEmpId = currentSchedule.employees[index + 1].empId;
      renderPersonalPanel();
    }
  });

  weekStartSelect.addEventListener('change', () => {
    currentWeekStart = parseInt(weekStartSelect.value, 10);
    renderPersonalPanel();
  });

  async function runQuery(){
    const rocYear = parseInt(rocYearInput.value, 10);
    const month = parseInt(monthSelect.value, 10);
    if(!rocYear || !month){ showToast('請輸入正確的年份與月份', true); return; }
    const westYear = rocToWest(rocYear);
    const schedule = await ScheduleRepository.load(category, westYear, month);
    currentSchedule = schedule;
    hidePersonalPanel(); // 換了查詢的年月，先收起個人班表面板，避免顯示到舊資料
    if(!schedule || schedule.employees.length === 0){
      resultArea.innerHTML = `<div class="empty-hint">尚無 民國${rocYear}年${month}月 的${CATEGORY_LABEL[category]}班表，請於下方上傳PDF匯入</div>`;
    }else{
      resultArea.innerHTML = `<div class="table-scroll">${renderScheduleTable(schedule)}</div>${LEGEND_HTML}`;
    }
  }

  root.querySelector('.btn-query').addEventListener('click', runQuery);

  // 點擊表格裡的姓名，開啟該員工的個人月班表(月曆樣式)
  resultArea.addEventListener('click', (e) => {
    const cell = e.target.closest('td.clickable-name');
    if(!cell || !currentSchedule) return;
    const empId = cell.dataset.empid;
    const emp = currentSchedule.employees.find(x => x.empId === empId);
    if(!emp) return;
    currentEmpId = empId;
    weekStartSelect.value = String(currentWeekStart);
    personalPanel.style.display = '';
    renderPersonalPanel();
  });

  // 點擊表格裡的班別代碼儲存格，就地修改該員工該天的班別代碼；
  // Enter 或點擊別處＝確定修改（存檔＋重新整理統計），Esc＝取消不存檔
  resultArea.addEventListener('click', (e) => {
    const cell = e.target.closest('td.editable-shift');
    if(!cell || !currentSchedule) return;
    if(cell.classList.contains('editing')) return; // 編輯中點輸入框本身，不要重新進入編輯
    startEditShiftCell(cell);
  });

  function startEditShiftCell(cell){
    const empId = cell.dataset.empid;
    const day = parseInt(cell.dataset.day, 10);
    const emp = currentSchedule.employees.find(x => x.empId === empId);
    if(!emp) return;
    const oldCode = emp.shifts[day] || '';

    cell.classList.add('editing');

    const restoreCellDisplay = (code) => {
      cell.classList.remove('editing');
      cell.className = `shift editable-shift ${shiftClass(code)}`;
      cell.textContent = code;
    };

    let settled = false;
    const commitValue = async (newCode) => {
      if(settled) return;
      settled = true;

      if(newCode === oldCode){
        restoreCellDisplay(oldCode); // 沒有變更，還原顯示即可，不用存檔
        return;
      }

      if(newCode) emp.shifts[day] = newCode;
      else delete emp.shifts[day]; // 清空代表這天沒有班別代碼

      try{
        await ScheduleRepository.save(currentSchedule);
        showToast(`已更新 ${emp.name} ${currentSchedule.month}/${day} 的班別為「${newCode || '(空白)'}」`);
        // 整張表重新渲染，統計列(D白班/E小夜/N大夜/合計)會依最新資料重新計算
        resultArea.innerHTML = `<div class="table-scroll">${renderScheduleTable(currentSchedule)}</div>${LEGEND_HTML}`;
      }catch(err){
        console.error(err);
        showToast('儲存失敗，請再試一次', true);
        if(oldCode) emp.shifts[day] = oldCode; else delete emp.shifts[day]; // 存檔失敗就還原回原本的資料
        restoreCellDisplay(oldCode);
      }
    };

    // 收集這份班表目前用過的所有班別代碼（加上幾個常見代碼），做成下拉選單選項，
    // 選單一定會把「目前的代碼」排進去，就算它不在常見清單裡
    const codeSet = new Set(['D', 'D1', 'E', 'N', 'OFF', '例', '國']);
    for(const e2 of currentSchedule.employees){
      for(const d2 in e2.shifts){
        const c = (e2.shifts[d2] || '').trim();
        if(c) codeSet.add(c);
      }
    }
    if(oldCode) codeSet.add(oldCode);
    const codes = Array.from(codeSet).sort((a, b) => a.localeCompare(b, 'zh-Hant'));

    const CUSTOM_VALUE = '__custom__';
    const optionsHtml = [
      `<option value="">(清空)</option>`,
      ...codes.map(c => `<option value="${escapeHtml(c)}" ${c === oldCode ? 'selected' : ''}>${escapeHtml(c)}</option>`),
      `<option value="${CUSTOM_VALUE}">✏ 自訂輸入...</option>`
    ].join('');

    cell.innerHTML = `<select class="shift-edit-select">${optionsHtml}</select>`;
    const select = cell.querySelector('select');
    select.focus();

    // 切換成文字輸入框，給清單裡沒有的全新代碼使用
    const switchToCustomInput = () => {
      cell.innerHTML = `<input type="text" class="shift-edit-input" value="${escapeHtml(oldCode)}" autocomplete="off">`;
      const input = cell.querySelector('input');
      input.focus();
      input.select();
      input.addEventListener('keydown', (ev) => {
        if(ev.key === 'Enter'){ ev.preventDefault(); commitValue(input.value.trim()); }
        else if(ev.key === 'Escape'){ ev.preventDefault(); settled = true; restoreCellDisplay(oldCode); }
      });
      input.addEventListener('blur', () => commitValue(input.value.trim()));
    };

    // 下拉選單：選了就直接算「確定」，馬上存檔並更新統計
    select.addEventListener('change', () => {
      if(select.value === CUSTOM_VALUE){ switchToCustomInput(); return; }
      commitValue(select.value);
    });
    select.addEventListener('blur', () => {
      // 延遲一下再檢查：如果已經切換成自訂輸入框（select已經不在這個儲存格裡了），就不要再處理
      setTimeout(() => {
        if(settled || select.parentNode !== cell) return;
        settled = true;
        restoreCellDisplay(oldCode);
      }, 150);
    });
  }

  root.querySelector('.btn-clear').addEventListener('click', async () => {
    const rocYear = parseInt(rocYearInput.value, 10);
    const month = parseInt(monthSelect.value, 10);
    if(!rocYear || !month) return;
    if(!confirm(`確定要清除 民國${rocYear}年${month}月 的${CATEGORY_LABEL[category]}班表嗎？`)) return;
    await ScheduleRepository.remove(category, rocToWest(rocYear), month);
    showToast('已清除該月份資料');
    runQuery();
  });

  // PDF 與 Excel 匯入共用同一套「解析結果 -> 預覽畫面」的處理邏輯
  async function presentParseResult(parsePromise, fileLabel){
    previewSummary.textContent = `正在解析${fileLabel}，請稍候...`;
    importPreview.classList.add('show');
    previewTableArea.innerHTML = '';
    importWarningSlot.innerHTML = '';
    overwriteWarningSlot.innerHTML = '';
    pendingSchedule = null;

    try{
      const { schedule, categoryMismatch, rowsFound } = await parsePromise;
      pendingSchedule = schedule;

      if(rowsFound === 0){
        previewSummary.innerHTML = `<span style="color:var(--shift-e)">未能從此檔案辨識出任何員工資料，請確認內容是否為班表表格，或改用其他檔案。</span>`;
        importRocYear.value = '';
        previewTableArea.innerHTML = '';
        return;
      }

      if(categoryMismatch){
        importWarningSlot.innerHTML = `<div class="import-warning">這份檔案內容看起來像是「${category === 'nurse' ? '病房助理' : '護理師'}」班表，但目前選擇的類別是「${CATEGORY_LABEL[category]}」，請確認是否選錯類別。</div>`;
      }

      const rocYear = schedule.westYear ? westToRoc(schedule.westYear) : '';
      importRocYear.value = rocYear;
      if(schedule.month) importMonth.value = schedule.month;

      previewSummary.textContent = `辨識到 ${schedule.employees.length} 位員工的班表資料，請確認年份/月份後匯入。`;
      previewTableArea.innerHTML = schedule.month
        ? renderScheduleTable(schedule)
        : '<div class="empty-hint">無法自動辨識年份/月份，請於上方手動輸入</div>';

      await refreshOverwriteWarning();
    }catch(err){
      console.error(err);
      previewSummary.innerHTML = `<span style="color:var(--shift-e)">檔案解析失敗：${escapeHtml(err.message || err)}</span>`;
    }
  }

  // 規則：匯入前若該「類別＋年＋月」已有資料，需明確提示——匯入會完全取代舊資料，而不是疊加
  async function refreshOverwriteWarning(){
    const rocYear = parseInt(importRocYear.value, 10);
    const month = parseInt(importMonth.value, 10);
    if(!rocYear || !month){ overwriteWarningSlot.innerHTML = ''; return; }
    const existing = await ScheduleRepository.load(category, rocToWest(rocYear), month);
    if(existing && existing.employees.length > 0){
      overwriteWarningSlot.innerHTML = `<div class="import-warning">
        民國${rocYear}年${month}月 已經有 ${CATEGORY_LABEL[category]}的班表資料（${existing.employees.length} 位員工）。
        依規則：匯入時會先刪除該年月${CATEGORY_LABEL[category]}的舊資料，再整批寫入這次的新資料，請確認無誤。
      </div>`;
    }else{
      overwriteWarningSlot.innerHTML = '';
    }
  }
  importRocYear.addEventListener('change', refreshOverwriteWarning);
  importMonth.addEventListener('change', refreshOverwriteWarning);

  pdfInput.addEventListener('change', () => {
    const file = pdfInput.files[0];
    if(!file) return;
    excelInput.value = '';
    presentParseResult(parsePdfToSchedule(file, category), 'PDF');
  });

  excelInput.addEventListener('change', () => {
    const file = excelInput.files[0];
    if(!file) return;
    pdfInput.value = '';
    presentParseResult(parseExcelToSchedule(file, category), 'Excel');
  });

  root.querySelector('.btn-confirm-import').addEventListener('click', async () => {
    if(!pendingSchedule){ showToast('尚未解析任何檔案', true); return; }
    const rocYear = parseInt(importRocYear.value, 10);
    const month = parseInt(importMonth.value, 10);
    if(!rocYear || !month){ showToast('請輸入正確的民國年與月份', true); return; }
    const westYear = rocToWest(rocYear);

    // 規則：同一「類別＋年＋月」的舊資料，匯入前必須先清除，再整批寫入新資料（而非疊加合併）
    const existing = await ScheduleRepository.load(category, westYear, month);
    if(existing && existing.employees.length > 0){
      const ok = confirm(`民國${rocYear}年${month}月 已有 ${CATEGORY_LABEL[category]}班表資料，匯入後會先刪除舊資料再寫入新資料，確定要繼續嗎？`);
      if(!ok) return;
      await ScheduleRepository.remove(category, westYear, month);
    }

    pendingSchedule.category = category;
    pendingSchedule.westYear = westYear;
    pendingSchedule.month = month;

    try{
      await ScheduleRepository.save(pendingSchedule);
      showToast(`已匯入 民國${rocYear}年${month}月 ${CATEGORY_LABEL[category]}班表`);
      importPreview.classList.remove('show');
      pdfInput.value = '';
      excelInput.value = '';
      pendingSchedule = null;

      // 若目前查詢區正好顯示同一個月份，順便刷新畫面
      if(parseInt(rocYearInput.value, 10) === rocYear && parseInt(monthSelect.value, 10) === month){
        runQuery();
      }
    }catch(err){
      showToast('儲存失敗：' + (err.message || err), true);
    }
  });

  root.querySelector('.btn-cancel-import').addEventListener('click', () => {
    importPreview.classList.remove('show');
    pdfInput.value = '';
    excelInput.value = '';
    pendingSchedule = null;
  });

  runQuery(); // 進入畫面即先查詢一次當月資料
}

  const btnCancel = document.getElementById('btnOfCancel');

  const btnSave = document.getElementById('btnOfSave');

/* =========================================================================
   九、App 版本與更新
   把 App 想成「放在家裡的一本手冊」：
     - GitHub 上是出版社的最新版
     - sw.js（背景小幫手）每次開啟、每 30 分鐘、切回 App 時，都會去問出版社有沒有新版
     - 有新版就先下載好放在旁邊，畫面最上方出現「立即更新」；按下去才換成新版
   發布新版時：同時修改這裡的 APP_VERSION 與 sw.js 的 VERSION（兩邊要一樣）。
   ========================================================================= */

const APP_VERSION = '2026.10.31.2';
const IOS_INSTALL_PAGE = 'https://achir1015.github.io/rcw-month/ios/';
const IN_IOS_APP = !!window.RcwIOS; // 在 iPhone／iPad App（比照小柯圍棋的安裝方式）裡執行
document.getElementById('appVersionLabel').textContent =
  IN_IOS_APP ? `網頁 ${APP_VERSION}・App ${window.RcwIOS.version}` : APP_VERSION;

// 比較版本號：'1.2.0' 與 '1.10.0' 逐段比數字
function compareVersion(a, b){
  const pa = String(a).split('.').map(n => parseInt(n, 10) || 0), pb = String(b).split('.').map(n => parseInt(n, 10) || 0);
  for(let i = 0; i < Math.max(pa.length, pb.length); i++){
    const d = (pa[i] || 0) - (pb[i] || 0);
    if(d) return d > 0 ? 1 : -1;
  }
  return 0;
}

// iPhone／iPad App：網頁會自動是最新版；App 本身（外殼）有新版時，提示回安裝頁重新安裝
async function checkIosAppUpdate(manual){
  try{
    const r = await fetch(IOS_INSTALL_PAGE + 'manifest.plist', { cache: 'no-cache' });
    const m = (await r.text()).match(/<key>bundle-version<\/key>\s*<string>([^<]+)<\/string>/);
    if(m && compareVersion(m[1], window.RcwIOS.version) > 0){
      updateBannerEl.querySelector('span').textContent = `月班表 App 有新版本 ${m[1]}`;
      document.getElementById('btnApplyUpdate').textContent = '前往安裝頁';
      waitingWorker = null;
      updateBannerEl.classList.add('show');
      return;
    }
    if(manual) showToast(`目前已是最新版本（網頁 ${APP_VERSION}・App ${window.RcwIOS.version}）`);
  }catch(err){
    if(manual) showToast('無法連線檢查更新，請確認網路', true);
  }
}
function openIosInstallPage(){
  const h = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.rcw;
  if(h) h.postMessage({ cmd: 'open_url', args: { url: IOS_INSTALL_PAGE } });
  else location.href = IOS_INSTALL_PAGE;
}
if(IN_IOS_APP) setTimeout(() => checkIosAppUpdate(false), 3000);

const updateBannerEl = document.getElementById('updateBanner');
let waitingWorker = null;
let swRegistration = null;

function showUpdateBanner(worker){
  waitingWorker = worker;
  updateBannerEl.classList.add('show');
}

document.getElementById('btnApplyUpdate').addEventListener('click', () => {
  if(IN_IOS_APP){ openIosInstallPage(); updateBannerEl.classList.remove('show'); return; }
  if(waitingWorker) waitingWorker.postMessage({ type: 'SKIP_WAITING' });
  else location.reload();
});
document.getElementById('btnLaterUpdate').addEventListener('click', () => updateBannerEl.classList.remove('show'));

function watchInstalling(worker){
  worker.addEventListener('statechange', () => {
    if(worker.state === 'installed' && navigator.serviceWorker.controller) showUpdateBanner(worker);
  });
}

if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', async () => {
    try{
      swRegistration = await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
      if(swRegistration.waiting && navigator.serviceWorker.controller) showUpdateBanner(swRegistration.waiting);
      swRegistration.addEventListener('updatefound', () => {
        if(swRegistration.installing) watchInstalling(swRegistration.installing);
      });
      setInterval(() => swRegistration.update().catch(() => {}), 30 * 60 * 1000);
      document.addEventListener('visibilitychange', () => {
        if(document.visibilityState === 'visible') swRegistration.update().catch(() => {});
      });
    }catch(err){
      console.warn('背景小幫手註冊失敗（不影響一般使用）:', err);
    }
  });
  // 第一次開啟時小幫手接手不需要重新整理（避免打字打到一半被刷新）；只有「舊版換新版」才重新載入
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(reloading || !hadController) return;
    reloading = true;
    location.reload();
  });
}

// 手動「檢查更新」
document.getElementById('btnCheckUpdate').addEventListener('click', async () => {
  if(IN_IOS_APP){ showToast('正在檢查更新…'); checkIosAppUpdate(true); return; }
  if(!swRegistration){ showToast('此瀏覽器不支援自動更新，請重新整理頁面取得最新版'); return; }
  showToast('正在檢查更新…');
  try{
    await swRegistration.update();
    const w = swRegistration.installing || swRegistration.waiting;
    if(!w){ showToast(`目前已是最新版本（${APP_VERSION}）`); return; }
    if(w.state === 'installed') showUpdateBanner(w);
    else watchInstalling(w);
  }catch(err){
    showToast('無法連線檢查更新，請確認網路', true);
  }
});

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches
      || window.matchMedia('(display-mode: window-controls-overlay)').matches
      || window.navigator.standalone === true;
}

function detectPlatform(){
  const ua = navigator.userAgent;
  const touchMac = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1; // iPadOS 會偽裝成 Mac
  if(/iPad/.test(ua) || touchMac) return 'ipad';
  if(/iPhone|iPod/.test(ua)) return 'iphone';
  if(/Android/.test(ua)) return 'android';
  if(/Macintosh|Mac OS X/.test(ua)) return 'mac';
  if(/Windows/.test(ua)) return 'windows';
  return 'other';
}
function isSafariBrowser(){
  const ua = navigator.userAgent;
  return /Safari/.test(ua) && !/Chrome|CriOS|Edg|EdgiOS|FxiOS|Firefox|OPR/.test(ua);
}

  if(one) one.addEventListener('click', async () => {
    deferredInstallPrompt.prompt();
    const { outcome } = await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    closeSheet('installSheet');
    if(outcome === 'accepted') showToast('已安裝「月班表」App');
  });
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();             // 改由我們的「安裝 App」按鈕觸發
  deferredInstallPrompt = e;
  if(!isStandalone() && !IN_IOS_APP) btnInstallEl.style.display = '';
});
window.addEventListener('appinstalled', () => {
  btnInstallEl.style.display = 'none';
  deferredInstallPrompt = null;
});
// Safari（iPhone／iPad／Mac）沒有一鍵安裝事件，也顯示按鈕，點開看步驟
if(!isStandalone() && !IN_IOS_APP && (isSafariBrowser() || ['iphone','ipad'].includes(detectPlatform()))){
  btnInstallEl.style.display = '';
}
btnInstallEl.addEventListener('click', () => { renderInstallSheet(); openSheet('installSheet'); });
