// 依目前畫面決定預設要唸哪一段說明
function currentVoiceTopic(){
  const visible = id => { const el = document.getElementById(id); return el && el.style.display !== 'none' && el.offsetParent !== null; };
  if(visible('loginScreen')) return 'login';
  if(visible('orgScreen')) return document.getElementById('orgManage').style.display !== 'none' ? 'manage' : 'org';
  if(document.querySelector('.workspace.active')) return 'schedule';
  return 'home';
}

const synth = window.speechSynthesis || null;
const voiceTextEl = document.getElementById('voiceText');
const voiceStatusEl = document.getElementById('voiceStatus');
const voiceRateEl = document.getElementById('voiceRate');
let voiceTopicKey = 'home';
let voiceQueueIndex = 0;
let voiceSpeaking = false;

function pickChineseVoice(){
  if(!synth) return null;
  const voices = synth.getVoices();
  const prefer = ['zh-TW', 'zh_TW', 'zh-HK', 'zh_HK', 'zh-CN', 'zh_CN', 'zh'];
  for(const tag of prefer){
    const v = voices.find(v => v.lang && v.lang.replace('_','-').toLowerCase().startsWith(tag.replace('_','-').toLowerCase()));
    if(v) return v;
  }
  return null;
}
if(synth && typeof synth.addEventListener === 'function') synth.addEventListener('voiceschanged', () => {});

function renderVoiceTopic(key){
  voiceTopicKey = key;
  document.querySelectorAll('#voiceTopics button').forEach(b => b.classList.toggle('active', b.dataset.topic === key));
  const t = VOICE_TOPICS[key];
  voiceTextEl.innerHTML = t.lines.map((s, i) => `<p data-i="${i}">${escapeHtml(s)}</p>`).join('');
}

function highlightLine(i){
  voiceTextEl.querySelectorAll('p').forEach(p => p.classList.toggle('speaking', Number(p.dataset.i) === i));
}

function speakFrom(index){
  if(!synth){ voiceStatusEl.textContent = '這個瀏覽器不支援語音播放，請直接閱讀下方文字。'; return; }
  synth.cancel();
  const lines = VOICE_TOPICS[voiceTopicKey].lines;
  voiceQueueIndex = index;
  voiceSpeaking = true;
  const voice = pickChineseVoice();
  voiceStatusEl.textContent = voice ? `播放中（${voice.name}）` : '播放中（找不到中文語音，將使用系統預設語音）';
  const speakNext = () => {
    if(!voiceSpeaking || voiceQueueIndex >= lines.length){
      voiceSpeaking = false; highlightLine(-1);
      if(voiceQueueIndex >= lines.length) voiceStatusEl.textContent = '播放完畢';
      return;
    }
    const u = new SpeechSynthesisUtterance(lines[voiceQueueIndex]);
    u.lang = voice ? voice.lang : 'zh-TW';
    if(voice) u.voice = voice;
    u.rate = parseFloat(voiceRateEl.value) || 1;
    highlightLine(voiceQueueIndex);
    u.onend = () => { voiceQueueIndex++; speakNext(); };
    u.onerror = () => { voiceSpeaking = false; highlightLine(-1); };
    synth.speak(u);
  };
  speakNext();
}

function stopVoice(){
  voiceSpeaking = false;
  if(synth) synth.cancel();
  highlightLine(-1);
  voiceStatusEl.textContent = '';
}

document.getElementById('voiceTopics').innerHTML = Object.entries(VOICE_TOPICS)
  .map(([k, t]) => `<button type="button" data-topic="${k}">${escapeHtml(t.title)}</button>`).join('');
document.querySelectorAll('#voiceTopics button').forEach(b => b.addEventListener('click', () => {
  stopVoice(); renderVoiceTopic(b.dataset.topic); speakFrom(0);
}));
document.getElementById('btnVoicePlay').addEventListener('click', () => {
  if(synth && synth.paused){ synth.resume(); voiceStatusEl.textContent = '繼續播放'; return; }
  speakFrom(0);
});
document.getElementById('btnVoicePause').addEventListener('click', () => {
  if(synth && synth.speaking && !synth.paused){ synth.pause(); voiceStatusEl.textContent = '已暫停，按「播放」繼續'; }
});
document.getElementById('btnVoiceStop').addEventListener('click', stopVoice);
voiceRateEl.addEventListener('change', () => { if(voiceSpeaking) speakFrom(voiceQueueIndex); });

document.getElementById('btnVoiceHelp').addEventListener('click', () => {
  renderVoiceTopic(currentVoiceTopic());
  voiceStatusEl.textContent = synth ? '按「播放」開始收聽，或點選上方主題' : '這個瀏覽器不支援語音播放，請直接閱讀下方文字。';
  openSheet('voiceSheet');
  if(synth) speakFrom(0); // 點按鈕本身就是使用者操作，iPhone／iPad 允許直接發聲
});

// ── 面板開關 ──
let lastFocusBeforeSheet = null;
function openSheet(id){
  lastFocusBeforeSheet = document.activeElement;
  const el = document.getElementById(id);
  el.classList.add('show');
  const closeBtn = el.querySelector('.sheet-close');
  if(closeBtn) closeBtn.focus();
}
function closeSheet(id){
  document.getElementById(id).classList.remove('show');
  if(id === 'voiceSheet') stopVoice();
  if(lastFocusBeforeSheet && lastFocusBeforeSheet.focus) lastFocusBeforeSheet.focus();
}
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closeSheet(b.dataset.close)));
document.querySelectorAll('.sheet-backdrop').forEach(bd => bd.addEventListener('click', (e) => { if(e.target === bd) closeSheet(bd.id); }));
document.addEventListener('keydown', (e) => {
  if(e.key !== 'Escape') return;
  document.querySelectorAll('.sheet-backdrop.show').forEach(bd => closeSheet(bd.id));
});
</script>
